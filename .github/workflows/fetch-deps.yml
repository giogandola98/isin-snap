name: fetch-deps (temporary)
on:
  push:
    branches: [embedded-ocr-deps]
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: mvn -B -q dependency:copy-dependencies -DoutputDirectory=deps
      - run: cd deps && ls -la && zip -q ../deps.zip *.jar
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create deps-tmp deps.zip --draft --title "temporary" --notes "temporary, will be deleted" --target "$GITHUB_SHA"
