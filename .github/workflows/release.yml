name: Release

# Every v* tag: build the jar, run the self-test, publish a GitHub Release with the jar and the demo video.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and self-test
        run: ./build.sh

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: OCR smoke test on the sample screenshot
        run: |
          java -jar build/isin-snap.jar --file samples/chat-bloomberg-simulated.png | tee ocr.txt
          grep -q "# 11 unique ISINs" ocr.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/isin-snap.jar \
            docs/demo.mp4 \
            --title "ISIN Snap $GITHUB_REF_NAME" \
            --notes "Requires Java 17+ and Tesseract 5. Run with: java -jar isin-snap.jar. See the README for setup."
