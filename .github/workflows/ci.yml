name: CI

# Every push to main (and every PR): run the tests; only if they pass, build the jar and publish it.
# Pushes to main also refresh the "main-latest" pre-release, so the latest good build is always one click away.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile and self-test
        run: ./build.sh

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: OCR test on the sample screenshot
        run: |
          java -jar build/isin-snap.jar --file samples/chat-bloomberg-simulated.png | tee ocr.txt
          grep -q "# 11 unique ISINs" ocr.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: isin-snap-${{ github.sha }}
          path: build/isin-snap.jar

      - name: Update the main-latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete main-latest --yes --cleanup-tag || true
          gh release create main-latest build/isin-snap.jar docs/demo.mp4 \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build from main" \
            --notes "Automatic build of ${GITHUB_SHA::7}, published because all tests passed. For stable versions use the v* releases."
